name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate tag
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run build:web
      - name: Create web artifact
        run: |
          mkdir -p release
          tar -czf "release/kui-native-web-${GITHUB_REF_NAME#v}.tar.gz" -C dist .
      - name: Create checksums
        run: sha256sum release/* > release/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## KUI Native ${{ github.ref_name }}

            KUI Native is the Expo/React Native implementation of the KUI design
            system. The attached web bundle is a static export that can be served
            by any standard web server or CDN.

            ### Artifacts

            - `kui-native-web-<version>.tar.gz` containing the Expo
              web export
            - `SHA256SUMS` for integrity verification

            Extract the archive into a web root and serve it as static content.
            Native Android and iOS store binaries are intentionally not produced
            by this workflow; those require EAS credentials and platform signing.

            This release does not contain an executable installer, Debian package,
            RPM package, or desktop binary.
          files: release/*
